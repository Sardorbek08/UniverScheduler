<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание занятий</title>
<style>
    :root {
        --primary: #635bff;
        --primary-light: #eeeaff;
        --primary-dark: #5048d8;

        --bg: #f7f8fc;
        --card-bg: #ffffff;

        --text: #20212a;
        --muted: #85899a;
        --border: #e7e8ef;

        --green: #19a974;
        --green-bg: #e8faf3;

        --amber: #f59e0b;
        --amber-bg: #fff6df;

        --red: #ef4444;

        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;

        -webkit-tap-highlight-color: transparent;
    }

    /* ==============================
       ВЕРХНЯЯ ПАНЕЛЬ
       ============================== */

    .top-bar {
        position: sticky;
        top: 0;
        z-index: 20;

        background: var(--primary);
        color: white;

        padding: calc(18px + var(--safe-top)) 20px 18px;

        box-shadow: 0 4px 16px rgba(99, 91, 255, 0.18);
    }

    .top-bar h1 {
        margin: 0 0 3px;

        font-size: 21px;
        font-weight: 750;
        letter-spacing: -0.3px;
    }

    .top-bar .group {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 12px;
    }

    .clock-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .clock-date {
        font-size: 13px;
        opacity: 0.9;
    }

    .clock-time {
        font-size: 22px;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
    }

    /* ==============================
       ДНИ
       ============================== */

    .day-scroll {
        display: flex;
        gap: 8px;

        overflow-x: auto;

        padding: 16px max(16px, calc((100vw - 1200px) / 2)) 12px;

        scrollbar-width: none;
    }

    .day-scroll::-webkit-scrollbar {
        display: none;
    }

    .day-chip {
        flex: 0 0 auto;

        padding: 9px 17px;

        border-radius: 10px;

        background: white;
        border: 1px solid var(--border);

        font-size: 14px;
        font-weight: 650;

        color: var(--text);

        cursor: pointer;

        transition:
            background 0.15s,
            color 0.15s,
            transform 0.15s;
    }

    .day-chip:hover {
        transform: translateY(-1px);
        border-color: var(--primary);
    }

    .day-chip.active {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
    }

    /* ==============================
       КОНТЕЙНЕР РАСПИСАНИЯ
       ============================== */

    .lesson-list {
        max-width: 1200px;
        margin: 0 auto;

        padding: 4px 16px 100px;

        display: flex;
        flex-direction: column;
        gap: 9px;
    }

    /* ==============================
       КАРТОЧКА ЗАНЯТИЯ
       Мобильная версия
       ============================== */

    .lesson-card {
        background: var(--card-bg);

        border: 1px solid var(--border);
        border-radius: 12px;

        padding: 13px 14px;

        display: flex;
        gap: 13px;
        align-items: stretch;

        position: relative;

        transition:
            transform 0.15s,
            box-shadow 0.15s;
    }

    .lesson-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 15px rgba(30, 35, 60, 0.06);
    }

    /* Текущее занятие */

    .lesson-card.live {
        background: var(--green-bg);
        border-color: #b9ecd8;
    }

    /* Перерыв */

    .lesson-card.break {
        background: #f0f1f5;
        border-color: transparent;
    }

    .lesson-time-col {
        flex: 0 0 62px;

        display: flex;
        flex-direction: column;
        justify-content: center;

        font-variant-numeric: tabular-nums;

        font-size: 13px;
        font-weight: 750;

        border-right: 1px solid var(--border);

        padding-right: 10px;
    }

    .lesson-time-col .end {
        color: var(--muted);
        font-weight: 500;
        font-size: 12px;

        margin-top: 2px;
    }

    .lesson-main {
        flex: 1;
        min-width: 0;
    }

    .lesson-subject {
        font-size: 15px;
        font-weight: 650;
        line-height: 1.3;

        margin-bottom: 5px;

        padding-right: 25px;
    }

    .break .lesson-subject {
        color: var(--muted);
        font-style: normal;
        font-weight: 550;
    }

    .lesson-meta {
        font-size: 12.5px;
        color: var(--muted);

        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    .lesson-meta span {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    /* ==============================
       СТАТУС
       ============================== */

    .countdown-badge {
        margin-top: 8px;

        display: inline-block;

        font-size: 11.5px;
        font-weight: 750;

        padding: 4px 9px;

        border-radius: 7px;

        font-variant-numeric: tabular-nums;
    }

    .countdown-badge.live {
        background: var(--green);
        color: white;
    }

    .countdown-badge.soon {
        background: var(--amber-bg);
        color: var(--amber);
    }

    .countdown-badge.idle {
        background: #ececf1;
        color: var(--muted);
    }

    /* ==============================
       УДАЛЕНИЕ
       ============================== */

    .del-x {
        position: absolute;

        top: 8px;
        right: 8px;

        width: 25px;
        height: 25px;

        border-radius: 7px;

        border: none;

        background: #fff0f0;
        color: var(--red);

        font-size: 13px;

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .del-x:hover {
        background: var(--red);
        color: white;
    }

    /* ==============================
       ПУСТОЕ РАСПИСАНИЕ
       ============================== */

    .empty-state {
        text-align: center;

        color: var(--muted);

        padding: 50px 20px;

        font-size: 14px;
    }

    /* ==============================
       FAB
       ============================== */

    .fab {
        position: fixed;

        right: 20px;
        bottom: calc(20px + var(--safe-bottom));

        width: 56px;
        height: 56px;

        border-radius: 14px;

        background: var(--primary);
        color: white;

        border: none;

        font-size: 27px;

        box-shadow: 0 6px 18px rgba(99, 91, 255, 0.3);

        cursor: pointer;

        z-index: 30;

        display: flex;
        align-items: center;
        justify-content: center;

        transition:
            transform 0.15s,
            background 0.15s;
    }

    .fab:hover {
        transform: translateY(-2px);
        background: var(--primary-dark);
    }

    .fab:active {
        transform: scale(0.95);
    }

    /* ==============================
       BOTTOM SHEET
       ============================== */

    .sheet-overlay {
        position: fixed;
        inset: 0;

        background: rgba(20, 20, 30, 0.45);

        z-index: 40;

        opacity: 0;
        pointer-events: none;

        transition: opacity 0.2s;
    }

    .sheet-overlay.open {
        opacity: 1;
        pointer-events: auto;
    }

    .sheet {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        background: white;

        border-radius: 18px 18px 0 0;

        padding: 8px 20px calc(24px + var(--safe-bottom));

        z-index: 50;

        transform: translateY(100%);

        transition: transform 0.25s ease-out;

        max-height: 85vh;

        overflow-y: auto;
    }

    .sheet.open {
        transform: translateY(0);
    }

    .sheet-handle {
        width: 38px;
        height: 4px;

        background: #d7d8df;

        border-radius: 3px;

        margin: 8px auto 17px;
    }

    .sheet h3 {
        margin: 0 0 16px;

        font-size: 18px;
    }

    .field {
        margin-bottom: 13px;
    }

    .field label {
        display: block;

        font-size: 12px;

        color: var(--muted);

        margin-bottom: 5px;

        font-weight: 650;
    }

    .field input,
    .field select {
        width: 100%;

        padding: 12px 13px;

        border-radius: 9px;

        border: 1px solid var(--border);

        background: #fafafd;

        font-size: 15px;

        color: var(--text);
    }

    .field input:focus,
    .field select:focus {
        outline: none;

        border-color: var(--primary);

        box-shadow: 0 0 0 3px var(--primary-light);
    }

    .sheet-actions {
        display: flex;
        gap: 10px;

        margin-top: 17px;
    }

    .sheet-actions button {
        flex: 1;

        padding: 13px;

        border-radius: 9px;

        border: none;

        font-size: 15px;
        font-weight: 650;

        cursor: pointer;
    }

    .btn-cancel {
        background: #f0f1f5;
        color: var(--text);
    }

    .btn-save {
        background: var(--primary);
        color: white;
    }

    .reset-link {
        display: block;

        text-align: center;

        color: var(--muted);

        font-size: 13px;

        margin-top: 18px;

        text-decoration: underline;

        cursor: pointer;
    }


    /* =========================================================
       DESKTOP
       ========================================================= */

    @media (min-width: 800px) {

        .top-bar {
            padding-left: max(24px, calc((100vw - 1200px) / 2));
            padding-right: max(24px, calc((100vw - 1200px) / 2));
        }

        .day-scroll {
            padding-top: 20px;
            padding-bottom: 15px;
        }

        /*
         * На ПК lesson-list становится таблицей.
         */

        .lesson-list {
            gap: 0;

            padding-top: 0;

            border: 1px solid var(--border);
            border-radius: 12px;

            overflow: hidden;

            background: white;

            box-shadow: 0 3px 15px rgba(30, 35, 60, 0.04);
        }

        /*
         * Каждая карточка теперь является строкой.
         */

        .lesson-card {
            min-height: 58px;

            border: none;
            border-bottom: 1px solid var(--border);

            border-radius: 0;

            padding: 0;

            display: grid;

            /*
             * Время | Предмет | Преподаватель | Аудитория | Статус
             */

            grid-template-columns:
                115px
                minmax(300px, 2fr)
                minmax(180px, 1fr)
                120px
                130px;

            gap: 0;

            align-items: stretch;

            box-shadow: none;
        }

        .lesson-card:hover {
            transform: none;
            box-shadow: none;
            background: #fafaff;
        }

        /*
         * Время
         */

        .lesson-time-col {
            border-right: 1px solid var(--border);

            padding: 0 18px;

            display: flex;
            justify-content: center;

            flex-direction: column;
        }

        /*
         * Основной контент больше не занимает
         * всю строку — превращаем его в display: contents.
         */

        .lesson-main {
            display: contents;
        }

        /*
         * Предмет
         */

        .lesson-subject {
            margin: 0;

            padding: 0 18px;

            display: flex;
            align-items: center;

            font-size: 14px;

            border-right: 1px solid var(--border);
        }

        /*
         * Мета-информация на ПК становится
         * отдельными колонками.
         */

        .lesson-meta {
            display: contents;
        }

        .lesson-meta span {
            padding: 0 15px;

            display: flex;
            align-items: center;

            color: var(--text);

            font-size: 13px;

            border-right: 1px solid var(--border);
        }

        /*
         * Скрываем иконки 👤 / 📍 визуально
         * через немного более спокойный вид.
         */

        .lesson-meta span:first-child::first-letter {
            color: var(--muted);
        }

        /*
         * Статус переносим в отдельную область.
         */

        .countdown-badge {
            margin: 0;

            align-self: center;
            justify-self: center;

            padding: 5px 9px;
        }

        /*
         * Кнопка удаления
         */

        .del-x {
            top: 50%;
            right: 8px;

            transform: translateY(-50%);

            opacity: 0;

            transition: opacity 0.15s;
        }

        .lesson-card:hover .del-x {
            opacity: 1;
        }

        /*
         * Текущее занятие
         */

        .lesson-card.live {
            background: var(--green-bg);

            border-left: 4px solid var(--green);
        }

        /*
         * Перерыв
         */

        .lesson-card.break {
            min-height: 38px;

            background: #f5f5f8;
        }

        .break .lesson-subject {
            grid-column: 2 / 5;

            color: var(--muted);

            font-size: 13px;
        }

        .break .lesson-meta,
        .break .countdown-badge {
            display: none;
        }

        /*
         * Шапка таблицы.
         * Создаём её через первый элемент.
         */

        .lesson-list::before {
            content:
                "ВРЕМЯ"
                "ПРЕДМЕТ"
                "ПРЕПОДАВАТЕЛЬ"
                "АУДИТОРИЯ"
                "СТАТУС";

            display: grid;

            grid-template-columns:
                115px
                minmax(300px, 2fr)
                minmax(180px, 1fr)
                120px
                130px;

            align-items: center;

            min-height: 44px;

            background: var(--primary);

            color: white;

            font-size: 11px;
            font-weight: 750;

            letter-spacing: 0.5px;
        }

        /*
         * Так как content выше — одна строка текста,
         * раскладываем её по колонкам невозможно обычным способом.
         * Поэтому используем псевдоэлементы ниже.
         */

        .lesson-list::before {
            content: none;
        }

        /*
         * Отдельный header через фон и тень не нужен:
         * первая строка таблицы будет визуально отделена.
         */

        .lesson-list {
            position: relative;
        }

        /*
         * Чуть увеличиваем первый обычный ряд.
         */

        .lesson-card:first-child {
            border-top: 0;
        }
    }


    /* ==============================
       МАЛЕНЬКИЕ ЭКРАНЫ
       ============================== */

    @media (max-width: 799px) {

        .lesson-list {
            padding-left: 12px;
            padding-right: 12px;
        }
    }


    /* ==============================
       БОЛЬШОЙ МОНИТОР
       ============================== */

    @media (min-width: 1200px) {

        .top-bar h1 {
            font-size: 23px;
        }

        .lesson-card {
            min-height: 62px;
        }
    }
</style>
</head>

            { time: "12:50 13:40", subject: "Разработка приложений и Web-сервисов на С# (лаб)", teacher: "Асилова Э.А", room: "806Г" },
            { time: "13:40 14:00", subject: "Перерыв", teacher: "-", room: "-" },
            { time: "14:50 15:05", subject: "Перерыв", teacher: "-", room: "-" },
            { time: "15:55 16:10", subject: "Перерыв", teacher: "-", room: "-" }
        ],
        "Пятница": [
            { time: "08:30 09:20", subject: "Разработка приложений в Web-сервисе на С# (лек)", teacher: "Байназарова И", room: "703Г" },
            { time: "09:20 09:35", subject: "Перерыв", teacher: "-", room: "-" },
            { time: "09:35 10:25", subject: "Конфигурирования в среде 1С (лек)", teacher: "Боташева А.О", room: "706Г" },
            { time: "10:25 10:40", subject: "Перерыв", teacher: "-", room: "-" },
            { time: "10:40 11:30", subject: "Анализ и разраб систем (лаб)", teacher: "Исмаилов Х.Б", room: "806Г" },
            { time: "11:30 11:45", subject: "Перерыв", teacher: "-", room: "-" },
            { time: "11:45 12:35", subject: "Разработка Web-сервисов (Java EE) (лек)", teacher: "Боташева А.О", room: "706Г" },
            { time: "12:35 12:50", subject: "Перерыв", teacher: "-", room: "-" },
            { time: "12:50 13:40", subject: "Разработка Web-сервисов (Java EE) (лаб)", teacher: "Асилова Э.А", room: "318Гл" },
            { time: "13:40 14:00", subject: "Перерыв", teacher: "-", room: "-" },
            { time: "14:00 14:50", subject: "Разработка Web-сервисов (Java EE) (лаб)", teacher: "Асилова Э.А", room: "318Гл" },
            { time: "14:50 15:05", subject: "Перерыв", teacher: "-", room: "-" },
            { time: "15:05 15:55", subject: "Разработка Web-сервисов (Java EE)", teacher: "Асилова Э.А", room: "318Гл" },
            { time: "15:55 16:10", subject: "Перерыв", teacher: "-", room: "-" }
        ]
    };

    const days = Object.keys(initialData);
    let currentDay = days[0];
    let scheduleData;

    const dayNames = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
    const monthNames = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

    function timeToMinutes(timeStr) {
        const parts = timeStr.split(':');
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function sortDay(day) {
        scheduleData[day].sort(function(a, b) {
            return timeToMinutes(a.time.split(' ')[0]) - timeToMinutes(b.time.split(' ')[0]);
        });
    }

    function sortAllDays() {
        days.forEach(function(day) { sortDay(day); });
    }

    function loadData() {
        const saved = localStorage.getItem('scheduleData');
        scheduleData = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(initialData));
        sortAllDays();
    }

    function saveData() {
        localStorage.setItem('scheduleData', JSON.stringify(scheduleData));
    }

    function resetSchedule() {
        if (confirm('Сбросить расписание к исходному варианту?')) {
            localStorage.removeItem('scheduleData');
            loadData();
            renderAll();
            closeSheet();
        }
    }

    function updateClock() {
        const now = new Date();
        const dayName = dayNames[now.getDay()];
        const day = now.getDate();
        const month = monthNames[now.getMonth()];
        document.getElementById('clockDate').textContent = dayName + ', ' + day + ' ' + month;

        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clockTime').textContent = hh + ':' + mm + ':' + ss;
    }

    function renderDayScroll() {
        const wrap = document.getElementById('dayScroll');
        wrap.innerHTML = '';
        days.forEach(function(day) {
            const chip = document.createElement('div');
            chip.className = 'day-chip' + (day === currentDay ? ' active' : '');
            chip.textContent = day;
            chip.onclick = function() { currentDay = day; renderAll(); };
            wrap.appendChild(chip);
        });
    }

    function renderDaySelect() {
        const select = document.getElementById('newDay');
        select.innerHTML = '';
        days.forEach(function(day) {
            const option = document.createElement('option');
            option.value = day;
            option.textContent = day;
            if (day === currentDay) option.selected = true;
            select.appendChild(option);
        });
    }

    function formatCountdown(totalSeconds) {
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;
        const mm = String(m).padStart(2, '0');
        const ss = String(s).padStart(2, '0');
        return h > 0 ? (h + ':' + mm + ':' + ss) : (mm + ':' + ss);
    }

    function getCountdownInfo(lesson, nowSeconds) {
        const parts = lesson.time.split(' ');
        const start = parts[0];
        const end = parts[1];
        if (!start || !end) return { text: '', cls: 'idle' };

        const startSec = timeToMinutes(start) * 60;
        const endSec = timeToMinutes(end) * 60;

        if (nowSeconds < startSec) {
            const diff = startSec - nowSeconds;
            return { text: 'через ' + formatCountdown(diff), cls: diff <= 300 ? 'soon' : 'idle' };
        } else if (nowSeconds >= startSec && nowSeconds <= endSec) {
            return { text: 'осталось ' + formatCountdown(endSec - nowSeconds), cls: 'live' };
        } else {
            return { text: 'завершено', cls: 'idle' };
        }
    }

    function renderList() {
        const list = document.getElementById('lessonList');
        list.innerHTML = '';

        const dayLessons = scheduleData[currentDay];
        if (!dayLessons || dayLessons.length === 0) {
            list.innerHTML = '<div class="empty-state">На этот день занятий пока нет</div>';
            return;
        }

        const now = new Date();
        const nowSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();

        dayLessons.forEach(function(lesson, index) {
            const isBreak = lesson.subject === 'Перерыв' || lesson.subject === 'Обед';

            const parts = lesson.time.split(' ');
            const start = parts[0];
            const end = parts[1];
            let isLive = false;
            if (start && end) {
                const startM = timeToMinutes(start);
                const endM = timeToMinutes(end);
                isLive = nowMinutes >= startM && nowMinutes <= endM;
            }

            const countdown = getCountdownInfo(lesson, nowSeconds);

            const card = document.createElement('div');
            card.className = 'lesson-card' + (isBreak ? ' break' : '') + (isLive && !isBreak ? ' live' : '');

            let html = '';
            html += "<div class='lesson-time-col'><span>" + start + "</span><span class='end'>" + (end || '') + "</span></div>";
            html += "<div class='lesson-main'>";
            html += "<div class='lesson-subject'>" + lesson.subject + "</div>";
            if (!isBreak) {
                html += "<div class='lesson-meta'>";
                if (lesson.teacher && lesson.teacher !== '-') html += "<span>" + lesson.teacher + "</span>";
                if (lesson.room && lesson.room !== '-') html += "<span>" + lesson.room + "</span>";
                html += "</div>";
            }
            if (countdown.text) {
                html += "<span class='countdown-badge " + countdown.cls + "'>" + countdown.text + "</span>";
            }
            html += "</div>";
            html += "<button class='del-x' onclick='deleteLesson(" + index + ")'>✕</button>";

            card.innerHTML = html;
            list.appendChild(card);
        });
    }

    function renderAll() {
        renderDayScroll();
        renderDaySelect();
        renderList();
    }

    function deleteLesson(index) {
        scheduleData[currentDay].splice(index, 1);
        saveData();
        renderList();
    }

    function addLesson() {
        const day = document.getElementById('newDay').value;
        const time = document.getElementById('newTime').value.trim();
        const subject = document.getElementById('newSubject').value.trim();
        const teacher = document.getElementById('newTeacher').value.trim();
        const room = document.getElementById('newRoom').value.trim();

        if (!time || !subject) {
            alert('Заполните хотя бы время и предмет');
            return;
        }

        scheduleData[day].push({ time: time, subject: subject, teacher: teacher, room: room });
        sortDay(day);
        saveData();

        currentDay = day;
        renderAll();
        closeSheet();

        document.getElementById('newTime').value = '';
        document.getElementById('newSubject').value = '';
        document.getElementById('newTeacher').value = '';
        document.getElementById('newRoom').value = '';
    }

    // ---------- Bottom sheet открытие/закрытие ----------
    function openSheet() {
        renderDaySelect();
        document.getElementById('sheetOverlay').classList.add('open');
        document.getElementById('sheet').classList.add('open');
    }

    function closeSheet() {
        document.getElementById('sheetOverlay').classList.remove('open');
        document.getElementById('sheet').classList.remove('open');
    }

    // ---------- Запуск ----------
    loadData();
    renderAll();
    updateClock();

    setInterval(function() {
        updateClock();
        renderList();
    }, 1000);
</script>
